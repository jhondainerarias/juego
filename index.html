<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¿Quién quiere ser millonario? - Edición Bíblica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #0a0615;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0615 70%);
        }

        /* Fondo con efecto de lujo */
        .fondo-lujo {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
        }

        /* Partículas doradas (CSS) */
        .particulas {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .particula {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, #ffd700, transparent);
            border-radius: 50%;
            animation: flotar linear infinite;
            opacity: 0;
        }
        @keyframes flotar {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .ui-overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 8px 10px 10px 10px;
            display: flex;
            flex-direction: column;
        }

        /* HEADER - Premios */
        .header-premios {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 6px 14px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .premio-actual {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .pregunta-numero {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: rgba(255, 215, 0, 0.6);
            background: rgba(255, 215, 0, 0.05);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        /* COMODINES */
        .comodines-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px 0;
            flex-wrap: wrap;
        }

        .comodin-btn {
            font-family: 'Nunito', sans-serif;
            font-size: clamp(0.6rem, 1.8vw, 0.75rem);
            padding: 5px 12px;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.15);
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 215, 0, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            backdrop-filter: blur(4px);
        }

        .comodin-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .comodin-btn.disponible {
            border-color: rgba(255, 215, 0, 0.4);
            color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }

        .comodin-btn.disponible:active {
            background: rgba(255, 215, 0, 0.2);
        }

        .comodin-btn.usado {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .comodin-btn .icono {
            font-size: clamp(0.8rem, 2.2vw, 1rem);
        }

        /* PREGUNTA */
        .pregunta-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4px 0;
            min-height: 0;
        }

        .pregunta-texto {
            font-family: 'Cinzel', serif;
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            text-align: center;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(4px);
            line-height: 1.4;
            color: #f5e6d3;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
            margin-bottom: 8px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* OPCIONES */
        .opciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .opcion-btn {
            font-family: 'Nunito', sans-serif;
            font-size: clamp(0.75rem, 2.2vw, 0.95rem);
            padding: 10px 8px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.6);
            color: #ddd;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            min-height: 50px;
            font-weight: 700;
        }

        .opcion-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .opcion-btn .letra {
            font-family: 'Fredoka One', cursive;
            color: #ffd700;
            font-size: clamp(0.8rem, 2.5vw, 1.1rem);
            min-width: 24px;
            text-align: center;
        }

        .opcion-btn .texto {
            flex: 1;
        }

        .opcion-btn.seleccionada {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.08);
        }

        .opcion-btn.correcta {
            border-color: #6bcb77;
            background: rgba(107, 203, 119, 0.2);
            box-shadow: 0 0 30px rgba(107, 203, 119, 0.15);
            animation: correctFlash 0.6s ease;
        }

        .opcion-btn.incorrecta {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.15);
            animation: wrongFlash 0.6s ease;
        }

        .opcion-btn.revelada-incorrecta {
            border-color: rgba(255, 107, 107, 0.3);
            background: rgba(255, 107, 107, 0.05);
            opacity: 0.4;
        }

        .opcion-btn:disabled {
            cursor: not-allowed;
        }

        @keyframes correctFlash {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes wrongFlash {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* NIVELES DE PREMIO */
        .premios-lista {
            display: none;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 8px 6px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            z-index: 20;
            max-height: 70vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 215, 0, 0.2) transparent;
        }

        .premios-lista::-webkit-scrollbar {
            width: 2px;
        }
        .premios-lista::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.2);
            border-radius: 10px;
        }

        .premio-item {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.5rem, 1.4vw, 0.7rem);
            padding: 2px 6px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            white-space: nowrap;
            border-radius: 4px;
        }

        .premio-item.actual {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .premio-item.asegurado {
            color: rgba(107, 203, 119, 0.6);
        }

        .premio-item.millon {
            color: #ffd700;
            font-size: clamp(0.6rem, 1.6vw, 0.8rem);
        }

        /* Botón mostrar premios */
        .btn-premios {
            position: absolute;
            right: 8px;
            top: 60px;
            z-index: 15;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: rgba(255, 215, 0, 0.4);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .btn-premios:active {
            transform: scale(0.9);
        }

        .btn-premios.activo {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            color: #ffd700;
        }

        /* MODAL FINAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: radial-gradient(ellipse at center, #1a0a2e, #0a0615);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 30px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.5s ease;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.05);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-icono {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .modal-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            margin-bottom: 8px;
        }

        .modal-subtitulo {
            font-family: 'Nunito', sans-serif;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .modal-premio {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .btn-reiniciar {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            padding: 14px 40px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            border: none;
            border-radius: 30px;
            color: #0a0615;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(255, 215, 0, 0.2);
            touch-action: manipulation;
        }

        .btn-reiniciar:active {
            transform: scale(0.95);
        }

        .btn-ahorcado {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            padding: 10px 20px;
            background: linear-gradient(135deg, #4d96ff, #9b59b6);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(77, 150, 255, 0.2);
            touch-action: manipulation;
            margin-top: 8px;
            display: inline-block;
            text-decoration: none;
        }

        .btn-ahorcado:active {
            transform: scale(0.95);
        }

        .btn-ahorcado .icono {
            margin-right: 6px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 16px;
            padding: 10px 20px;
            color: #ffd700;
            font-family: 'Nunito', sans-serif;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            z-index: 50;
            animation: slideUp 0.3s ease;
            display: none;
            backdrop-filter: blur(8px);
            text-align: center;
            max-width: 90%;
        }

        .toast.show {
            display: block;
        }

        /* Controles de audio */
        .audio-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            backdrop-filter: blur(4px);
        }

        .audio-controls .label {
            font-size: clamp(0.5rem, 1.5vw, 0.7rem);
            color: rgba(255, 215, 0, 0.3);
            font-family: 'Nunito', sans-serif;
        }

        .audio-controls button {
            background: none;
            border: none;
            color: rgba(255, 215, 0, 0.4);
            font-size: clamp(0.8rem, 2vw, 1rem);
            cursor: pointer;
            padding: 2px 6px;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .audio-controls button:active {
            transform: scale(0.9);
        }

        .audio-controls button:hover {
            color: #ffd700;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .ui-overlay {
                padding: 4px 6px 6px 6px;
            }
            .header-premios {
                padding: 4px 10px;
                border-radius: 12px;
            }
            .opcion-btn {
                padding: 8px 6px;
                font-size: clamp(0.65rem, 2vw, 0.8rem);
                min-height: 42px;
                border-radius: 10px;
            }
            .opcion-btn .letra {
                font-size: clamp(0.7rem, 2.2vw, 0.9rem);
                min-width: 20px;
            }
            .pregunta-texto {
                padding: 10px 12px;
                font-size: clamp(0.85rem, 3vw, 1.1rem);
                min-height: 56px;
                border-radius: 12px;
            }
            .comodin-btn {
                font-size: clamp(0.5rem, 1.6vw, 0.65rem);
                padding: 4px 10px;
            }
            .comodin-btn .icono {
                font-size: clamp(0.7rem, 2vw, 0.85rem);
            }
            .btn-premios {
                width: 28px;
                height: 28px;
                font-size: 12px;
                top: 52px;
                right: 6px;
            }
            .premios-lista {
                right: 4px;
                padding: 6px 4px;
            }
            .premio-item {
                font-size: clamp(0.4rem, 1.2vw, 0.55rem);
                padding: 1px 4px;
            }
            .modal-content {
                padding: 20px 16px;
            }
            .modal-icono {
                font-size: 3rem;
            }
            .audio-controls {
                bottom: 6px;
                padding: 2px 10px;
            }
        }

        @media (max-width: 380px) {
            .opcion-btn {
                padding: 6px 4px;
                font-size: clamp(0.55rem, 1.8vw, 0.7rem);
                min-height: 36px;
                gap: 4px;
            }
            .opcion-btn .letra {
                font-size: clamp(0.6rem, 1.8vw, 0.75rem);
                min-width: 16px;
            }
            .pregunta-texto {
                font-size: clamp(0.75rem, 2.5vw, 0.95rem);
                min-height: 48px;
                padding: 8px 10px;
            }
            .header-premios .premio-actual {
                font-size: clamp(0.8rem, 3vw, 1rem);
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .ui-overlay {
                padding: 2px 8px 4px 8px;
            }
            .header-premios {
                padding: 2px 10px;
            }
            .pregunta-texto {
                padding: 6px 12px;
                font-size: clamp(0.7rem, 2.5vw, 0.9rem);
                min-height: 40px;
            }
            .opcion-btn {
                padding: 4px 6px;
                font-size: clamp(0.55rem, 1.8vw, 0.7rem);
                min-height: 32px;
                border-radius: 8px;
            }
            .opcion-btn .letra {
                font-size: clamp(0.6rem, 1.8vw, 0.75rem);
                min-width: 16px;
            }
            .comodin-btn {
                font-size: clamp(0.45rem, 1.4vw, 0.6rem);
                padding: 2px 8px;
            }
            .comodines-container {
                padding: 2px 0;
                gap: 4px;
            }
            .btn-premios {
                width: 22px;
                height: 22px;
                font-size: 10px;
                top: 38px;
                right: 4px;
            }
            .audio-controls {
                bottom: 4px;
                padding: 2px 8px;
            }
        }
    </style>
</head>

            <span>2026</span>
            <span class="emoji">✨</span>
            <span style="font-size: clamp(0.5rem, 1.5vw, 0.7rem); -webkit-text-fill-color: initial; color: rgba(255,215,0,0.2); font-family: 'Nunito', sans-serif;">
                🎮 biblionario
            </span>
        </p>
    </footer>
<script>
    // ============================================
    // 0. CONTROL DE AUDIO
    // ============================================
    
    const audioElement = document.getElementById('musicaFondo');
    let audioActivo = true;

    // Intentar reproducir automáticamente
    function intentarReproducirAudio() {
        audioElement.play().catch(() => {
            // Algunos navegadores bloquean autoplay, intentamos con interacción
            document.addEventListener('click', function playOnClick() {
                audioElement.play();
                document.removeEventListener('click', playOnClick);
            }, { once: true });
            document.addEventListener('touchstart', function playOnTouch() {
                audioElement.play();
                document.removeEventListener('touchstart', playOnTouch);
            }, { once: true });
        });
    }

    // Desmutear después de un momento (para que el usuario pueda activar)
    setTimeout(() => {
        audioElement.muted = false;
    }, 100);

    // Intentar reproducir
    intentarReproducirAudio();

    function toggleAudio() {
        const btn = document.getElementById('btnAudio');
        if (audioElement.paused) {
            audioElement.play();
            audioElement.muted = false;
            btn.textContent = '🔊';
            audioActivo = true;
        } else {
            audioElement.pause();
            btn.textContent = '🔇';
            audioActivo = false;
        }
    }

    function reiniciarAudio() {
        audioElement.currentTime = 0;
        if (audioElement.paused) {
            audioElement.play();
            audioElement.muted = false;
            document.getElementById('btnAudio').textContent = '🔊';
            audioActivo = true;
        }
        mostrarToast('🔄 Canción reiniciada');
    }

    // ============================================
    // 1. ENLACE AL AHORCADO
    // ============================================
    
    function irAlAhorcado() {
        // Aquí puedes poner el enlace a tu juego de ahorcado
        // Ejemplo: window.location.href = 'ahorcado-biblico.html';
        mostrarToast('🔮 Abriendo el Ahorcado Bíblico...');
        // Si tienes el juego en otro archivo, descomenta la línea de abajo:
        // window.location.href = 'ahorcado-biblico.html';
        
        // Si es el mismo archivo, mostramos un mensaje
        setTimeout(() => {
            window.location.href = 'ahorcado-biblico.html';
        }, 1000);
    }

    // ============================================
    // 2. PREGUNTAS BÍBLICAS (DIFÍCILES)
    // ============================================
    
    const PREGUNTAS = [
        // Nivel 1-3 (Fáciles-Medias)
        {
            pregunta: "¿Quién fue el primer rey de Israel?",
            opciones: ["David", "Saúl", "Salomón", "Josué"],
            correcta: 1,
            nivel: 1
        },
        {
            pregunta: "¿Qué animal habló con Balaam?",
            opciones: ["Burro", "Cabra", "Camello", "Oveja"],
            correcta: 0,
            nivel: 1
        },
        {
            pregunta: "¿Cuántos días duró el diluvio según Génesis?",
            opciones: ["40 días", "150 días", "370 días", "120 años"],
            correcta: 0,
            nivel: 1
        },
        // Nivel 4-6 (Medias)
        {
            pregunta: "¿Qué profeta fue llevado al cielo en un carro de fuego?",
            opciones: ["Elías", "Eliseo", "Isaías", "Ezequiel"],
            correcta: 0,
            nivel: 2
        },
        {
            pregunta: "¿Cuál de estos NO era un apóstol?",
            opciones: ["Mateo", "Marcos", "Juan", "Andrés"],
            correcta: 1,
            nivel: 2
        },
        {
            pregunta: "¿En qué libro se encuentra la historia de Sansón?",
            opciones: ["Jueces", "Reyes", "Samuel", "Crónicas"],
            correcta: 0,
            nivel: 2
        },
        // Nivel 7-9 (Difíciles)
        {
            pregunta: "¿Qué rey de Judá reinó por más tiempo?",
            opciones: ["Manasés", "Josías", "Ezequías", "Uzías"],
            correcta: 0,
            nivel: 3
        },
        {
            pregunta: "¿Cuál es el salmo más corto de la Biblia?",
            opciones: ["Salmo 23", "Salmo 117", "Salmo 119", "Salmo 1"],
            correcta: 1,
            nivel: 3
        },
        {
            pregunta: "¿Quién fue el suegro de Moisés?",
            opciones: ["Jetró", "Aarón", "Josué", "Caleb"],
            correcta: 0,
            nivel: 3
        },
        // Nivel 10-12 (Muy difíciles)
        {
            pregunta: "¿Qué apóstol fue decapitado por Herodes Agripa?",
            opciones: ["Santiago", "Pedro", "Juan", "Felipe"],
            correcta: 0,
            nivel: 4
        },
        {
            pregunta: "¿En qué año fue destruido el Templo de Jerusalén?",
            opciones: ["70 d.C.", "586 a.C.", "70 a.C.", "586 d.C."],
            correcta: 0,
            nivel: 4
        },
        {
            pregunta: "¿Cuántos capítulos tiene el libro de Isaías?",
            opciones: ["66", "50", "42", "55"],
            correcta: 0,
            nivel: 4
        },
        // Nivel 13-15 (Extremadamente difíciles)
        {
            pregunta: "¿Qué profeta escribió: 'No con ejército, ni con fuerza, sino con mi Espíritu'?",
            opciones: ["Zacarías", "Ageo", "Malaquías", "Joel"],
            correcta: 0,
            nivel: 5
        },
        {
            pregunta: "¿Cuántas veces aparece la palabra 'amor' en el libro de Cantares?",
            opciones: ["0 veces", "25 veces", "15 veces", "8 veces"],
            correcta: 0,
            nivel: 5
        },
        {
            pregunta: "¿Qué rey se convirtió en leproso por su orgullo?",
            opciones: ["Uzías", "Azarías", "Ezequías", "Josías"],
            correcta: 0,
            nivel: 5
        }
    ];

    // ============================================
    // 3. PREMIOS
    // ============================================
    
    const PREMIOS = [
        { valor: "$100", nivel: 1, asegurado: false },
        { valor: "$200", nivel: 1, asegurado: false },
        { valor: "$500", nivel: 1, asegurado: false },
        { valor: "$1,000", nivel: 2, asegurado: false },
        { valor: "$2,000", nivel: 2, asegurado: false },
        { valor: "$5,000", nivel: 2, asegurado: false },
        { valor: "$10,000", nivel: 3, asegurado: false },
        { valor: "$20,000", nivel: 3, asegurado: false },
        { valor: "$50,000", nivel: 3, asegurado: false },
        { valor: "$100,000", nivel: 4, asegurado: false },
        { valor: "$200,000", nivel: 4, asegurado: false },
        { valor: "$500,000", nivel: 4, asegurado: false },
        { valor: "$750,000", nivel: 5, asegurado: false },
        { valor: "$1,000,000", nivel: 5, asegurado: true }
    ];

    // ============================================
    // 4. ESTADO DEL JUEGO
    // ============================================
    
    let preguntaActual = 0;
    let juegoActivo = true;
    let esperandoSiguiente = false;
    let premioAsegurado = 0;
    let comodines = {
        '5050': true,
        'publico': true,
        'amigo': true
    };
    let preguntasUsadas = [];
    let preguntasNivel = [];

    // ============================================
    // 5. ELEMENTOS DOM
    // ============================================
    
    const preguntaTexto = document.getElementById('preguntaTexto');
    const opcionesGrid = document.getElementById('opcionesGrid');
    const opcionBtns = document.querySelectorAll('.opcion-btn');
    const preguntaNumero = document.getElementById('preguntaNumero');
    const premioActual = document.getElementById('premioActual');
    const premiosLista = document.getElementById('premiosLista');
    const modalFinal = document.getElementById('modalFinal');
    const modalIcono = document.getElementById('modalIcono');
    const modalTitulo = document.getElementById('modalTitulo');
    const modalSubtitulo = document.getElementById('modalSubtitulo');
    const modalPremio = document.getElementById('modalPremio');
    const toast = document.getElementById('toast');
    const btnPremios = document.getElementById('btnPremios');

    // ============================================
    // 6. FUNCIONES PRINCIPALES
    // ============================================
    
    function iniciarJuego() {
        preguntaActual = 0;
        juegoActivo = true;
        esperandoSiguiente = false;
        premioAsegurado = 0;
        comodines = {
            '5050': true,
            'publico': true,
            'amigo': true
        };
        preguntasUsadas = [];
        actualizarComodinesUI();
        generarPreguntasNivel();
        mostrarPregunta();
        actualizarPremiosUI();
        modalFinal.classList.remove('show');
    }

    function generarPreguntasNivel() {
        const niveles = [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4, 5, 5, 5];
        const preguntasSeleccionadas = [];
        const copiaPreguntas = [...PREGUNTAS];
        
        niveles.forEach(nivel => {
            const disponibles = copiaPreguntas.filter(p => p.nivel === nivel);
            if (disponibles.length > 0) {
                const idx = Math.floor(Math.random() * disponibles.length);
                const seleccionada = disponibles[idx];
                preguntasSeleccionadas.push(seleccionada);
                const removeIdx = copiaPreguntas.indexOf(seleccionada);
                if (removeIdx > -1) copiaPreguntas.splice(removeIdx, 1);
            }
        });
        
        preguntasNivel = preguntasSeleccionadas;
    }

    function mostrarPregunta() {
        if (preguntaActual >= preguntasNivel.length) {
            victoriaCompleta();
            return;
        }

        const pregunta = preguntasNivel[preguntaActual];
        preguntaTexto.textContent = pregunta.pregunta;
        preguntaNumero.textContent = `PREGUNTA ${preguntaActual + 1}`;
        premioActual.textContent = PREMIOS[preguntaActual].valor;

        const opciones = pregunta.opciones.map((texto, idx) => ({
            texto,
            index: idx,
            esCorrecta: idx === pregunta.correcta
        }));
        
        for (let i = opciones.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opciones[i], opciones[j]] = [opciones[j], opciones[i]];
        }

        opcionBtns.forEach((btn, i) => {
            btn.querySelector('.texto').textContent = opciones[i].texto;
            btn.dataset.correcta = opciones[i].esCorrecta ? 'true' : 'false';
            btn.dataset.originalIndex = opciones[i].index;
            btn.className = 'opcion-btn';
            btn.disabled = false;
            btn.style.opacity = '1';
        });

        actualizarPremiosUI();
    }

    function seleccionarRespuesta(index) {
        if (!juegoActivo || esperandoSiguiente) return;
        
        const btn = opcionBtns[index];
        if (btn.disabled) return;

        const esCorrecta = btn.dataset.correcta === 'true';
        btn.classList.add(esCorrecta ? 'correcta' : 'incorrecta');
        btn.disabled = true;

        opcionBtns.forEach(b => b.disabled = true);

        if (esCorrecta) {
            mostrarToast('✅ ¡Respuesta correcta!');
            
            if (preguntaActual === 4 || preguntaActual === 9) {
                premioAsegurado = preguntaActual + 1;
                mostrarToast(`💰 ¡Premio asegurado: ${PREMIOS[preguntaActual].valor}!`);
            }

            setTimeout(() => {
                preguntaActual++;
                if (preguntaActual >= preguntasNivel.length) {
                    victoriaCompleta();
                } else {
                    mostrarPregunta();
                }
            }, 1200);

        } else {
            opcionBtns.forEach(b => {
                if (b.dataset.correcta === 'true') {
                    b.classList.add('correcta');
                }
            });
            
            setTimeout(() => {
                finJuego(false);
            }, 1500);
        }
    }

    function finJuego(esVictoria) {
        juegoActivo = false;
        
        if (esVictoria) {
            mostrarModal('🎉', '¡ERES MILLONARIO!', 'Has ganado el premio máximo', '$1,000,000');
        } else {
            const premio = premioAsegurado > 0 ? PREMIOS[premioAsegurado - 1].valor : '$0';
            const mensaje = premioAsegurado > 0 ? `Te llevas ${premio}` : 'No ganaste nada';
            mostrarModal('😔', '¡INCORRECTO!', mensaje, premio);
        }
    }

    function victoriaCompleta() {
        juegoActivo = false;
        mostrarModal('🎉', '¡ERES MILLONARIO!', 'Has respondido todas las preguntas correctamente', '$1,000,000');
    }

    // ============================================
    // 7. COMODINES
    // ============================================
    
    function usarComodin(tipo) {
        if (!juegoActivo || esperandoSiguiente || !comodines[tipo]) return;
        
        comodines[tipo] = false;
        actualizarComodinesUI();

        switch(tipo) {
            case '5050':
                usar5050();
                break;
            case 'publico':
                usarPublico();
                break;
            case 'amigo':
                usarAmigo();
                break;
        }
    }

    function usar5050() {
        const incorrectas = [];
        opcionBtns.forEach(btn => {
            if (btn.dataset.correcta === 'false') {
                incorrectas.push(btn);
            }
        });
        
        for (let i = incorrectas.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [incorrectas[i], incorrectas[j]] = [incorrectas[j], incorrectas[i]];
        }
        
        const eliminar = incorrectas.slice(0, 2);
        eliminar.forEach(btn => {
            btn.style.opacity = '0.3';
            btn.disabled = true;
            btn.classList.add('revelada-incorrecta');
        });

        mostrarToast('🗳️ 50/50: Dos opciones eliminadas');
    }

    function usarPublico() {
        let correctaIndex = -1;
        opcionBtns.forEach((btn, i) => {
            if (btn.dataset.correcta === 'true') correctaIndex = i;
        });

        const votos = [0, 0, 0, 0];
        const totalVotos = 100;
        let votoCorrecto = 40 + Math.floor(Math.random() * 30);
        let restante = totalVotos - votoCorrecto;
        
        opcionBtns.forEach((btn, i) => {
            if (i === correctaIndex) {
                votos[i] = votoCorrecto;
            } else {
                votos[i] = Math.floor(restante / 3) + Math.floor(Math.random() * 10);
                restante -= votos[i];
            }
        });
        votos[correctaIndex] += restante;

        let mensaje = '👥 El público opina:\n';
        opcionBtns.forEach((btn, i) => {
            const letra = ['A', 'B', 'C', 'D'][i];
            mensaje += `${letra}: ${votos[i]}% `;
        });
        mostrarToast(mensaje);
    }

    function usarAmigo() {
        let correctaIndex = -1;
        opcionBtns.forEach((btn, i) => {
            if (btn.dataset.correcta === 'true') correctaIndex = i;
        });

        const acierta = Math.random() < 0.8;
        const letras = ['A', 'B', 'C', 'D'];
        let respuesta;

        if (acierta) {
            respuesta = letras[correctaIndex];
        } else {
            let incorrectas = letras.filter((_, i) => i !== correctaIndex);
            respuesta = incorrectas[Math.floor(Math.random() * incorrectas.length)];
        }

        mostrarToast(`📞 Tu amigo cree que es la opción ${respuesta}`);
    }

    function actualizarComodinesUI() {
        ['5050', 'publico', 'amigo'].forEach(tipo => {
            const btn = document.getElementById(`comodin${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`);
            if (comodines[tipo]) {
                btn.className = 'comodin-btn disponible';
            } else {
                btn.className = 'comodin-btn usado';
            }
        });
    }

    // ============================================
    // 8. PREMIOS UI
    // ============================================
    
    function actualizarPremiosUI() {
        const lista = document.getElementById('premiosLista');
        lista.innerHTML = '';
        
        PREMIOS.forEach((premio, i) => {
            const item = document.createElement('div');
            item.className = 'premio-item';
            if (i === preguntaActual) item.classList.add('actual');
            if (i === 4 || i === 9) item.classList.add('asegurado');
            if (i === 14) item.classList.add('millon');
            item.textContent = premio.valor;
            lista.appendChild(item);
        });
    }

    function togglePremios() {
        const lista = document.getElementById('premiosLista');
        const btn = document.getElementById('btnPremios');
        
        if (lista.style.display === 'block') {
            lista.style.display = 'none';
            btn.classList.remove('activo');
        } else {
            lista.style.display = 'block';
            btn.classList.add('activo');
            actualizarPremiosUI();
        }
    }

    // ============================================
    // 9. MODAL
    // ============================================
    
    function mostrarModal(icono, titulo, subtitulo, premio) {
        modalIcono.textContent = icono;
        modalTitulo.textContent = titulo;
        modalSubtitulo.textContent = subtitulo;
        modalPremio.textContent = premio;
        modalFinal.classList.add('show');
    }

    function reiniciarJuego() {
        iniciarJuego();
        // Reiniciar audio si está pausado
        if (audioElement.paused) {
            audioElement.play();
            audioElement.muted = false;
            document.getElementById('btnAudio').textContent = '🔊';
        }
    }

    // ============================================
    // 10. TOAST
    // ============================================
    
    function mostrarToast(mensaje) {
        toast.textContent = mensaje;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ============================================
    // 11. PARTÍCULAS CSS
    // ============================================
    
    function crearParticulas() {
        const container = document.getElementById('particulas');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particula';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (10 + Math.random() * 20) + 's';
            p.style.animationDelay = (Math.random() * 20) + 's';
            p.style.width = (2 + Math.random() * 4) + 'px';
            p.style.height = p.style.width;
            container.appendChild(p);
        }
    }
    crearParticulas();

    // ============================================
    // 12. INICIO
    // ============================================
    
    iniciarJuego();

    console.log('🎯 ¿Quién quiere ser millonario? - Edición Bíblica');
    console.log(`📖 ${PREGUNTAS.length} preguntas bíblicas difíciles`);
    console.log('💰 15 niveles de premios');
    console.log('🎮 3 comodines: 50/50, Público, Amigo');
    console.log('🔊 Música de fondo con reproducción automática');
    console.log('🔮 Enlace al Ahorcado Bíblico');
</script>
